<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="TCP Congestion Control">
  <defs>
    <clipPath id="c02d"><rect x="1" y="1" width="558" height="188" rx="10" ry="10"/></clipPath>
    <path id="rail02d" d="M24,14 L536,14"/>
  </defs>
  <g clip-path="url(#c02d)">
    <rect width="560" height="190" fill="#0A0A0C"/>
    <rect x="0" y="0" width="560" height="190" rx="10" ry="10" fill="none" stroke="#2B2B31" stroke-width="2"/>

    <rect x="0" y="0" width="4" height="0" fill="#4C8DFF">
      <animate attributeName="height" from="0" to="190" dur="0.8s" begin="0.4s" fill="freeze"/>
    </rect>

    <line x1="24" y1="14" x2="536" y2="14" stroke="#2B2B31" stroke-width="1"/>
    <circle r="2.5" fill="#4C8DFF">
      <animateMotion dur="5s" begin="0.4s" repeatCount="indefinite">
        <mpath href="#rail02d" xlink:href="#rail02d"/>
      </animateMotion>
    </circle>

    <text x="30" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#4C8DFF" opacity="0">02
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/></text>

    <text x="30" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#F2F2F4" opacity="0">TCP Congestion Control
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/></text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B8B94" letter-spacing="0.3">
      <text x="30" y="114" opacity="0">An interactive walkthrough of how TCP throttles
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8500000000000001s" fill="freeze"/></text>
      <text x="30" y="132" opacity="0">itself when the network starts dropping packets.
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/></text>
    </g>

    <line x1="30" y1="152" x2="30" y2="152" stroke="#2B2B31" stroke-width="1">
      <animate attributeName="x2" from="30" to="530" dur="0.9s" begin="0.8500000000000001s" fill="freeze"/></line>

    <circle cx="35" cy="170" r="3" fill="#4C8DFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="48" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4C8DFF" opacity="0">Python · Streamlit
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/></text>
  </g>
</svg>
