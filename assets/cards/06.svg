<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="Tic-Tac-Toe">
  <defs>
    <clipPath id="c06"><rect x="1" y="1" width="558" height="188" rx="10" ry="10"/></clipPath>
    <path id="rail06" d="M24,14 L536,14"/>
  </defs>
  <g clip-path="url(#c06)">
    <rect width="560" height="190" fill="#FAFAFA"/>
    <rect x="0" y="0" width="560" height="190" rx="10" ry="10" fill="none" stroke="#D8D8DC" stroke-width="2"/>

    <rect x="0" y="0" width="4" height="0" fill="#2F6FE0">
      <animate attributeName="height" from="0" to="190" dur="0.8s" begin="2.0s" fill="freeze"/>
    </rect>

    <line x1="24" y1="14" x2="536" y2="14" stroke="#D8D8DC" stroke-width="1"/>
    <circle r="2.5" fill="#2F6FE0">
      <animateMotion dur="5s" begin="2.0s" repeatCount="indefinite">
        <mpath href="#rail06" xlink:href="#rail06"/>
      </animateMotion>
    </circle>

    <text x="30" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#2F6FE0" opacity="0">06
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.15s" fill="freeze"/></text>

    <text x="30" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#17171B" opacity="0">Tic-Tac-Toe
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/></text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6B6B73" letter-spacing="0.3">
      <text x="30" y="114" opacity="0">A terminal game written to get properly
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.45s" fill="freeze"/></text>
      <text x="30" y="132" opacity="0">comfortable with C and game state.
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/></text>
    </g>

    <line x1="30" y1="152" x2="30" y2="152" stroke="#D8D8DC" stroke-width="1">
      <animate attributeName="x2" from="30" to="530" dur="0.9s" begin="2.45s" fill="freeze"/></line>

    <circle cx="35" cy="170" r="3" fill="#2F6FE0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="2.0s" repeatCount="indefinite"/></circle>
    <text x="48" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#2F6FE0" opacity="0">C
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/></text>
  </g>
</svg>
