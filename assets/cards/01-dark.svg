<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="server-client-system-in-java">
  <defs>
    <clipPath id="c01d"><rect x="1" y="1" width="558" height="188" rx="10" ry="10"/></clipPath>
    <path id="rail01d" d="M24,14 L536,14"/>
  </defs>
  <g clip-path="url(#c01d)">
    <rect width="560" height="190" fill="#0A0A0C"/>
    <rect x="0" y="0" width="560" height="190" rx="10" ry="10" fill="none" stroke="#2B2B31" stroke-width="2"/>

    <rect x="0" y="0" width="4" height="0" fill="#4C8DFF">
      <animate attributeName="height" from="0" to="190" dur="0.8s" begin="0.0s" fill="freeze"/>
    </rect>

    <line x1="24" y1="14" x2="536" y2="14" stroke="#2B2B31" stroke-width="1"/>
    <circle r="2.5" fill="#4C8DFF">
      <animateMotion dur="5s" begin="0.0s" repeatCount="indefinite">
        <mpath href="#rail01d" xlink:href="#rail01d"/>
      </animateMotion>
    </circle>

    <text x="30" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#4C8DFF" opacity="0">01
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.15s" fill="freeze"/></text>

    <text x="30" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F2F4" opacity="0">server-client-system-in-java
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/></text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B8B94" letter-spacing="0.3">
      <text x="30" y="114" opacity="0">Multithreaded chat server with a Swing client:
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/></text>
      <text x="30" y="132" opacity="0">messaging, file transfer, remote commands over sockets.
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/></text>
    </g>

    <line x1="30" y1="152" x2="30" y2="152" stroke="#2B2B31" stroke-width="1">
      <animate attributeName="x2" from="30" to="530" dur="0.9s" begin="0.45s" fill="freeze"/></line>

    <circle cx="35" cy="170" r="3" fill="#4C8DFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
    <text x="48" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#4C8DFF" opacity="0">Java
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/></text>
  </g>
</svg>
