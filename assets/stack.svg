<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Stack: languages, web, data, desktop and tooling">

  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="1200" height="250" rx="12" ry="12"/></clipPath>
    <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24404A" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="250" fill="#0B1519"/>
    <rect width="1200" height="250" fill="url(#mesh)"/>

    <!-- column 1 : Languages -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="60" y="48" font-size="11" letter-spacing="3.5" fill="#E9B872">LANGUAGES</text>
      <line x1="60" y1="60" x2="60" y2="60" stroke="#24404A" stroke-width="1.5">
        <animate attributeName="x2" from="60" to="180" dur="0.7s" begin="0.1s" fill="freeze"/></line>
      <g font-size="14" fill="#E6EEF0">
        <text x="60" y="90"  opacity="0">Java<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/></text>
        <text x="60" y="118" opacity="0">Python<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.45s" fill="freeze"/></text>
        <text x="60" y="146" opacity="0">C<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/></text>
        <text x="60" y="174" opacity="0">JavaScript<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.65s" fill="freeze"/></text>
        <text x="60" y="202" opacity="0">SQL<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.75s" fill="freeze"/></text>
      </g>
      <circle cx="46" cy="85" r="3" fill="#7FD1C1">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- column 2 : Web -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="290" y="48" font-size="11" letter-spacing="3.5" fill="#E9B872">WEB</text>
      <line x1="290" y1="60" x2="290" y2="60" stroke="#24404A" stroke-width="1.5">
        <animate attributeName="x2" from="290" to="410" dur="0.7s" begin="0.25s" fill="freeze"/></line>
      <g font-size="14" fill="#E6EEF0">
        <text x="290" y="90"  opacity="0">HTML<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/></text>
        <text x="290" y="118" opacity="0">CSS<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/></text>
        <text x="290" y="146" opacity="0">Bootstrap<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/></text>
      </g>
      <circle cx="276" cy="85" r="3" fill="#7FD1C1">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- column 3 : Data -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="520" y="48" font-size="11" letter-spacing="3.5" fill="#E9B872">DATA</text>
      <line x1="520" y1="60" x2="520" y2="60" stroke="#24404A" stroke-width="1.5">
        <animate attributeName="x2" from="520" to="640" dur="0.7s" begin="0.4s" fill="freeze"/></line>
      <g font-size="14" fill="#E6EEF0">
        <text x="520" y="90"  opacity="0">pandas<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.65s" fill="freeze"/></text>
        <text x="520" y="118" opacity="0">NumPy<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.75s" fill="freeze"/></text>
        <text x="520" y="146" opacity="0">Streamlit<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.85s" fill="freeze"/></text>
      </g>
      <circle cx="506" cy="85" r="3" fill="#7FD1C1">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- column 4 : Desktop -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="750" y="48" font-size="11" letter-spacing="3.5" fill="#E9B872">DESKTOP</text>
      <line x1="750" y1="60" x2="750" y2="60" stroke="#24404A" stroke-width="1.5">
        <animate attributeName="x2" from="750" to="870" dur="0.7s" begin="0.55s" fill="freeze"/></line>
      <g font-size="14" fill="#E6EEF0">
        <text x="750" y="90"  opacity="0">JavaFX<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/></text>
        <text x="750" y="118" opacity="0">Java Swing<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/></text>
        <text x="750" y="146" opacity="0">GraphStream<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/></text>
      </g>
      <circle cx="736" cy="85" r="3" fill="#7FD1C1">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- column 5 : Tooling -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="980" y="48" font-size="11" letter-spacing="3.5" fill="#E9B872">TOOLING</text>
      <line x1="980" y1="60" x2="980" y2="60" stroke="#24404A" stroke-width="1.5">
        <animate attributeName="x2" from="980" to="1100" dur="0.7s" begin="0.7s" fill="freeze"/></line>
      <g font-size="14" fill="#E6EEF0">
        <text x="980" y="90"  opacity="0">Git<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.95s" fill="freeze"/></text>
        <text x="980" y="118" opacity="0">MySQL<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.05s" fill="freeze"/></text>
        <text x="980" y="146" opacity="0">Linux<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.15s" fill="freeze"/></text>
        <text x="980" y="174" opacity="0">IntelliJ IDEA<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.25s" fill="freeze"/></text>
        <text x="980" y="202" opacity="0">VS Code<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.35s" fill="freeze"/></text>
      </g>
      <circle cx="966" cy="85" r="3" fill="#7FD1C1">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
    </g>

  </g>
</svg>
