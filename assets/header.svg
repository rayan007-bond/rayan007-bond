<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Muhammad Rayan — software engineering student in Quetta, Pakistan">

  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="340" rx="12" ry="12"/>
    </clipPath>

    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#7FD1C1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7FD1C1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24404A" fill-opacity="0.55"/>
    </pattern>

    <!-- routing edges -->
    <path id="e1" d="M640,120 L762,208"/>
    <path id="e2" d="M762,208 L884,96"/>
    <path id="e3" d="M884,96 L1006,182"/>
    <path id="e4" d="M1006,182 L1112,104"/>
    <path id="e5" d="M762,208 L900,262"/>
    <path id="e6" d="M900,262 L1006,182"/>
    <path id="e7" d="M640,120 L884,96"/>
  </defs>

  <g clip-path="url(#card)">

    <rect width="1200" height="340" fill="#0B1519"/>
    <rect x="560" y="40" width="640" height="260" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- instrument frame -->
    <g stroke="#24404A" stroke-width="1.5" fill="none">
      <path d="M28,54 L28,28 L54,28"/>
      <path d="M1146,28 L1172,28 L1172,54"/>
      <path d="M28,286 L28,312 L54,312"/>
      <path d="M1146,312 L1172,312 L1172,286"/>
    </g>

    <!-- ================= routing map ================= -->
    <g stroke="#7FD1C1" stroke-opacity="0.28" stroke-width="1.2" fill="none">
      <use href="#e1" xlink:href="#e1"/><use href="#e2" xlink:href="#e2"/><use href="#e3" xlink:href="#e3"/>
      <use href="#e4" xlink:href="#e4"/><use href="#e5" xlink:href="#e5"/><use href="#e6" xlink:href="#e6"/><use href="#e7" xlink:href="#e7"/>
    </g>

    <!-- ping rings -->
    <g fill="none" stroke="#E9B872">
      <circle cx="640" cy="120" r="5">
        <animate attributeName="r" values="5;22" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="884" cy="96" r="5">
        <animate attributeName="r" values="5;22" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="104" r="5">
        <animate attributeName="r" values="5;22" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- nodes -->
    <g fill="#0B1519" stroke="#E9B872" stroke-width="2">
      <circle cx="640"  cy="120" r="5.5"/>
      <circle cx="762"  cy="208" r="5.5"/>
      <circle cx="884"  cy="96"  r="5.5"/>
      <circle cx="1006" cy="182" r="5.5"/>
      <circle cx="1112" cy="104" r="5.5"/>
      <circle cx="900"  cy="262" r="5.5"/>
    </g>

    <!-- node labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="10" fill="#7E9AA3" fill-opacity="0.75" letter-spacing="0.6">
      <text x="640"  y="104" text-anchor="middle">server-client</text>
      <text x="756"  y="228" text-anchor="middle">tcp-congestion</text>
      <text x="884"  y="80"  text-anchor="middle">prim-routing</text>
      <text x="1018" y="200" text-anchor="start">cert-sender</text>
      <text x="1112" y="88"  text-anchor="middle">med-store</text>
      <text x="900"  y="282" text-anchor="middle">tic-tac-toe</text>
    </g>

    <!-- packets in flight -->
    <g fill="#7FD1C1">
      <circle r="3">
        <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1" xlink:href="#e1"/></animateMotion>
      </circle>
      <circle r="3">
        <animateMotion dur="3.1s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2" xlink:href="#e2"/></animateMotion>
      </circle>
      <circle r="3">
        <animateMotion dur="2.7s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3" xlink:href="#e3"/></animateMotion>
      </circle>
      <circle r="3">
        <animateMotion dur="2.0s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4" xlink:href="#e4"/></animateMotion>
      </circle>
      <circle r="3" fill="#E9B872">
        <animateMotion dur="2.9s" begin="0.2s" repeatCount="indefinite"><mpath href="#e5" xlink:href="#e5"/></animateMotion>
      </circle>
      <circle r="3" fill="#E9B872">
        <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#e6" xlink:href="#e6"/></animateMotion>
      </circle>
      <circle r="3">
        <animateMotion dur="3.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#e7" xlink:href="#e7"/></animateMotion>
      </circle>
    </g>

    <!-- ================= identity block ================= -->
    <text x="60" y="130"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" letter-spacing="4.5" fill="#7E9AA3">QUETTA · PAKISTAN</text>

    <text x="60" y="192" font-family="Georgia, 'Times New Roman', serif"
          font-size="56" fill="#E6EEF0">Muhammad <tspan fill="#E9B872">Rayan</tspan></text>

    <line x1="60" y1="216" x2="60" y2="216" stroke="#E9B872" stroke-width="2">
      <animate attributeName="x2" from="60" to="300" dur="1.2s" begin="0.3s" fill="freeze"/>
    </line>

    <text x="60" y="252"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13.5" letter-spacing="1.2" fill="#7E9AA3">software engineering student</text>

    <text x="60" y="276"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13.5" letter-spacing="1.2" fill="#7E9AA3">networks · data · automation</text>

    <rect x="336" y="264" width="9" height="15" fill="#E9B872">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
