<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FD1C1" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#7FD1C1" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#E9B872" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E9B872" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="10" x2="1200" y2="10" stroke="#24404A" stroke-width="1"/>

  <rect x="-260" y="8.5" width="260" height="3" fill="url(#pulse)" rx="1.5">
    <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <circle cy="10" r="2.5" fill="#E9B872">
    <animate attributeName="cx" from="-10" to="1210" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
